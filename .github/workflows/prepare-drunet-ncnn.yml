name: Prepare DRUNet ncnn model

on:
  workflow_dispatch:
  push:
    branches:
      - genspark_ai_developer
    paths:
      - ".github/workflows/prepare-drunet-ncnn.yml"

permissions:
  contents: write

concurrency:
  group: prepare-drunet-ncnn-${{ github.ref }}
  cancel-in-progress: false

jobs:
  convert-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Install ONNX converter build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git libprotobuf-dev protobuf-compiler python3-pip python3-venv

      - name: Install pinned PNNX and CPU PyTorch model exporter
        run: |
          python3 -m venv "$RUNNER_TEMP/pnnx-venv"
          "$RUNNER_TEMP/pnnx-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/pnnx-venv/bin/python" -m pip install pnnx==20261020 onnx==1.20.1
          # The checkpoint export stage imports torch; install the pinned CPU wheel here.
          "$RUNNER_TEMP/pnnx-venv/bin/python" -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/pnnx-venv/bin/python" - <<'PY'
          import torch
          print("PyTorch:", torch.__version__)
          assert torch.__version__.split('+')[0] == "2.14.1"
          print("CPU capability:", torch.backends.cpu.get_cpu_capability())
          PY
          test -x "$RUNNER_TEMP/pnnx-venv/bin/pnnx"
          echo "PNNX_CONVERTER=$RUNNER_TEMP/pnnx-venv/bin/pnnx" >> "$GITHUB_ENV"
          echo "MODEL_PYTHON=$RUNNER_TEMP/pnnx-venv/bin/python" >> "$GITHUB_ENV"

      - name: Cache pinned CPU ncnn source and build
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ncnn
            ${{ runner.temp }}/ncnn-build
          key: ${{ runner.os }}-ubuntu24-ncnn-20261020-cpu-release-v1

      - name: Build pinned CPU ncnn library for conversion smoke test
        env:
          NCNN_TAG: 20261020
        run: |
          if [ ! -d "$RUNNER_TEMP/ncnn/.git" ]; then
            git clone --depth 1 --branch "$NCNN_TAG" https://github.com/Tencent/ncnn.git "$RUNNER_TEMP/ncnn"
          fi
          git -C "$RUNNER_TEMP/ncnn" submodule update --init --recursive
          cmake -S "$RUNNER_TEMP/ncnn" -B "$RUNNER_TEMP/ncnn-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNCNN_VULKAN=OFF \
            -DNCNN_OPENMP=OFF \
            -DNCNN_BUILD_TOOLS=OFF \
            -DNCNN_BUILD_EXAMPLES=OFF \
            -DNCNN_BUILD_BENCHMARK=OFF \
            -DNCNN_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/ncnn-build" --parallel 2
          LIBNCNN="$(find "$RUNNER_TEMP/ncnn-build" -type f -name 'libncnn.a' -print -quit)"
          test -n "$LIBNCNN"
          echo "NCNN_LIBRARY=$LIBNCNN" >> "$GITHUB_ENV"
          echo "NCNN_ROOT=$RUNNER_TEMP/ncnn" >> "$GITHUB_ENV"

      - name: Download and verify the MIT DRUNet student checkpoint
        run: |
          mkdir -p "$RUNNER_TEMP/drunet"
          curl --fail --location --retry 4 --retry-all-errors \
            https://huggingface.co/seantempesta/remaster-drunet/resolve/main/drunet_student.pth \
            -o "$RUNNER_TEMP/drunet/drunet_student.pth"
          echo "21ee495de84de866d91af7c78e58cf8d1d68dc1d9016dd8e38f65f3a0559861e  $RUNNER_TEMP/drunet/drunet_student.pth" | sha256sum --check
          git clone --depth 1 https://github.com/seantempesta/remaster.git "$RUNNER_TEMP/remaster-source"
          git -C "$RUNNER_TEMP/remaster-source" submodule update --init --depth 1 reference-code/KAIR
          "$MODEL_PYTHON" - "$RUNNER_TEMP/remaster-source" "$RUNNER_TEMP/drunet/drunet_student.pth" "$RUNNER_TEMP/drunet/drunet_student.pt" <<'PY'
          import os, sys, torch
          project, checkpoint, output = sys.argv[1:]
          sys.path.insert(0, project)
          from lib.paths import add_kair_to_path
          add_kair_to_path()
          from models.network_unet import UNetRes
          torch.set_num_threads(1)
          state = torch.load(checkpoint, map_location="cpu", weights_only=True)
          state = state.get("params", state.get("model", state))
          model = UNetRes(in_nc=3, out_nc=3, nc=[16, 32, 64, 128], nb=2, act_mode="R", bias=False)
          model.load_state_dict(state, strict=True)
          # Keep the traced graph input FP32. PNNX stores weights in FP16,
          # while the Android staging API supplies normalized FP32 tensors.
          model.eval().float()
          sample = torch.zeros((1, 3, 128, 128), dtype=torch.float32)
          with torch.inference_mode():
              out = model(sample)
          assert tuple(out.shape) == (1, 3, 128, 128), tuple(out.shape)
          traced = torch.jit.trace(model, sample, strict=False, check_trace=False)
          torch.jit.save(traced, output)
          print("TorchScript student model exported:", tuple(out.shape), "FP32 input", os.path.getsize(output), "bytes")
          PY

      - name: Convert TorchScript to ncnn and smoke-test the graph
        run: |
          mkdir -p "$RUNNER_TEMP/drunet/converted"
          cd "$RUNNER_TEMP/drunet/converted"
          # Convert the model directly from the upstream architecture's TorchScript trace;
          # PNNX's ONNX path leaves dynamic height/width unresolved for this export.
          "$PNNX_CONVERTER" "$RUNNER_TEMP/drunet/drunet_student.pt" \
            inputshape=[1,3,128,128] inputshape2=[1,3,512,512] fp16=1 optlevel=2
          test -s "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.param"
          test -s "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.bin"
          g++ -O2 -std=c++17 \
            -I"$NCNN_ROOT/src" \
            "$GITHUB_WORKSPACE/tools/neural_model_smoke.cpp" \
            "$NCNN_LIBRARY" -pthread -ldl -lm \
            -o "$RUNNER_TEMP/drunet/ncnn-model-smoke"
          "$RUNNER_TEMP/drunet/ncnn-model-smoke" \
            "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.param" \
            "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.bin"
          sha256sum "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.param" "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.bin" > "$RUNNER_TEMP/drunet/converted/SHA256SUMS"
          cat "$RUNNER_TEMP/drunet/converted/SHA256SUMS"

      - name: Publish verified ncnn model files to the current branch
        env:
          MODEL_DIR: app/src/main/assets/ai/restoration/remaster_drunet
        run: |
          mkdir -p "$MODEL_DIR"
          cp "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.param" "$MODEL_DIR/drunet_student.param"
          cp "$RUNNER_TEMP/drunet/converted/drunet_student.ncnn.bin" "$MODEL_DIR/drunet_student.bin"
          (cd "$MODEL_DIR" && sha256sum drunet_student.param drunet_student.bin > SHA256SUMS)
          python3 - "$MODEL_DIR/drunet_student.param" "$MODEL_DIR/model.json" <<'PY'
          import json, sys
          param_path, output_path = sys.argv[1:]
          lines = [line.strip() for line in open(param_path, encoding="utf-8") if line.strip() and not line.lstrip().startswith("#")]
          layers = []
          for line in lines[2:]:
              fields = line.split()
              if len(fields) < 4:
                  continue
              try:
                  bottom_count, top_count = int(fields[2]), int(fields[3])
              except ValueError:
                  continue
              start = 4
              bottoms = fields[start:start + bottom_count]
              tops = fields[start + bottom_count:start + bottom_count + top_count]
              if len(bottoms) == bottom_count and len(tops) == top_count and top_count:
                  layers.append((fields[0], tops))
          input_blob = next((tops[0] for kind, tops in layers if kind == "Input"), None)
          output_blob = layers[-1][1][-1] if layers else None
          if not input_blob or not output_blob:
              raise SystemExit("Could not derive ncnn input/output blob names from generated param file")
          model = {
              "id": "remaster-drunet-student",
              "name": "Remaster DRUNet Student",
              "license": "MIT",
              "source": "https://huggingface.co/seantempesta/remaster-drunet",
              "source_file": "drunet_student.pth",
              "source_sha256": "21ee495de84de866d91af7c78e58cf8d1d68dc1d9016dd8e38f65f3a0559861e",
              "runtime": "ncnn",
              "input_blob": input_blob,
              "output_blob": output_blob,
              "input_layout": "NCHW",
              "input_type": "float32",
              "input_range": "RGB float32 0..1",
              "output_range": "RGB float16/float32 0..1 (runtime graph dtype)",
              "traced_shapes": [[1, 3, 128, 128], [1, 3, 512, 512]],
              "scale": 1,
              "spatial_multiple": 8,
              "kind": "single-frame video-compression restoration",
              "note": "Model card reports training on 1080p HEVC video. Does not by itself guarantee real-time playback on mobile GPUs."
          }
          with open(output_path, "w", encoding="utf-8") as out:
              json.dump(model, out, indent=2)
              out.write("\n")
          print("Generated model metadata:", input_blob, "->", output_blob)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MODEL_DIR"
          if git diff --cached --quiet; then
            echo "Verified model files are already current."
          else
            git commit -m "Add verified Remaster DRUNet ncnn model"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
